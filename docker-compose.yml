services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env                        # GOOGLE_API_KEY, TAVILY_API_KEY, etc.
    volumes:
      - db-data:/app/lens_memory.db       # SQLite persists across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
